name: Terraform CI

on:
  push:
    branches:
      - main
      - feature-*
  
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Init Validate 
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        run: terraform init


      - name: Terraform Validate
        run: terraform validate


